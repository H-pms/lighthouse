name: lighthouse
on:
  workflow_dispatch:        # Actions 탭의 수동 실행 버튼
  schedule:
    - cron: "30 21 * * *"   # 매일 06:30 KST (UTC 21:30) 무렵, 지연 가능
permissions:
  contents: write           # 봇이 브리핑 파일을 저장소에 커밋하기 위함
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser
      - run: python collector.py
      - name: commit briefing
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          
